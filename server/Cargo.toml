[package]
name = "rapidraw-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server that lets AI agents drive a running RapidRAW editor"
license = "MIT"
publish = false

[dependencies]
rmcp = { version = "=3.8.0", features = ["transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
